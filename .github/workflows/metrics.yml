name: GitHub Metrics

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

jobs:
  github-metrics:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Generate GitHub Metrics
        uses: lowlighter/metrics@latest
        with:
          # =========================================================
          # BASIC CONFIGURATION
          # =========================================================
          token: ${{ secrets.METRICS_TOKEN }}
          user: soo6ya

          template: classic

          base: header, activity, community, repositories, metadata

          config_timezone: Asia/Kolkata

          # =========================================================
          # CONTRIBUTION CALENDAR
          # =========================================================
          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year

          # =========================================================
          # PROGRAMMING LANGUAGES
          # =========================================================
          plugin_languages: yes
          plugin_languages_sections: most-used
          plugin_languages_limit: 8
          plugin_languages_threshold: 0%

          # =========================================================
          # FEATURED REPOSITORIES
          # =========================================================
          plugin_repositories: yes

          plugin_repositories_featured: soo6ya/AI-Network-Anomaly-Detection, soo6ya/tg-converter-bot, soo6ya/internet-speed-test

          plugin_repositories_pinned: 0
          plugin_repositories_starred: 0
          plugin_repositories_random: 0

          # =========================================================
          # LINES OF CODE
          # =========================================================
          plugin_lines: yes
          plugin_lines_sections: base, repositories

          # =========================================================
          # STARRED TOPICS
          # =========================================================
          plugin_topics: yes
          plugin_topics_sort: stars
          plugin_topics_limit: 15

          # =========================================================
          # FOLLOW-UP STATISTICS
          # =========================================================
          plugin_followup: yes

          # =========================================================
          # DISABLED PLUGINS
          # =========================================================

          # Previously caused token-scope error
          plugin_projects: no

          # Previously caused unexpected error
          plugin_habits: no

          # Previously caused errors
          plugin_achievements: no

          # =========================================================
          # OUTPUT
          # =========================================================
          filename: github-metrics.svg
