name: GitHub Metrics

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

jobs:
  github-metrics:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Generate GitHub Metrics
        uses: lowlighter/metrics@latest
        with:
          # =========================================================
          # BASIC CONFIGURATION
          # =========================================================
          token: ${{ secrets.METRICS_TOKEN }}
          user: soo6ya

          template: classic

          base: header, activity, community, repositories, metadata

          config_timezone: Asia/Kolkata

          # =========================================================
          # CONTRIBUTION CALENDAR
          # =========================================================
          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year

          # =========================================================
          # PROGRAMMING LANGUAGES
          # =========================================================
          plugin_languages: yes
          plugin_languages_sections: most-used
          plugin_languages_limit: 8
          plugin_languages_threshold: 0%

          # =========================================================
          # STARRED TOPICS
          # =========================================================
          plugin_topics: yes
          plugin_topics_sort: stars
          plugin_topics_limit: 15

          # =========================================================
          # FOLLOW-UP STATISTICS
          # =========================================================
          plugin_followup: yes

          # =========================================================
          # LINES OF CODE
          # =========================================================
          plugin_lines: yes
          plugin_lines_sections: base, repositories

          # =========================================================
          # EXPLICITLY DISABLED PLUGINS
          # =========================================================

          # Featured repositories - disabled because it caused errors
          plugin_repositories: no

          # Recently starred repositories - disabled
          plugin_stars: no

          # GitHub Projects - disabled because of token scope error
          plugin_projects: no

          # Coding habits - disabled because of previous error
          plugin_habits: no

          # Achievements - disabled because of previous error
          plugin_achievements: no

          # =========================================================
          # OUTPUT
          # =========================================================
          filename: github-metrics.svg
